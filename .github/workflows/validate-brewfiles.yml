name: Validate Brewfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "build_files/validate-brewfiles.sh"
      - "system_files/usr/share/ublue-os/homebrew/**"
      - ".github/workflows/validate-brewfiles.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@eb02c69dbabdb66ff183c614f4ce7ab3c077592c # main

      - name: Validate Brewfiles
        shell: bash
        run: bash build_files/validate-brewfiles.sh
