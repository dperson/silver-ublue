---
name: Build ISOs (Live Anaconda)

on:
  # schedule:
  #   - cron: "50 6 * * 0" # 06:50 UTC on Sundays
  workflow_dispatch:
    inputs:
      image_version:
        description: 'Which image version to build'
        type: choice
        required: true
        default: 'latest'
        options:
          - latest
          - all
  #     upload_artifacts:
  #       description: 'Upload ISOs as job artifacts'
  #       type: boolean
  #       default: false
  #     upload_r2:
  #       description: 'Upload ISOs to Cloudflare R2'
  #       type: boolean
  #       default: true
  # pull_request:
  #   paths:
  #     - ".github/workflows/build-iso-anaconda.yml"
  #     - "build_files/iso/configure_iso_anaconda.sh"
  # push:
  #   paths:
  #     - ".github/workflows/build-iso-anaconda.yml"
  #     - "build_files/iso/configure_iso_anaconda.sh"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}-${{ inputs.brand_name }}-${{ inputs.stream_name }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_NAME: "silver-ublue"

jobs:
  # Define which variants to build based on input
  determine-matrix:
    name: Determine Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set Matrix
        id: set-matrix
        run: |
          # Define the matrix based on the input selection
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            case "${{ github.event.inputs.image_version }}" in
              "latest")
                matrix='{"include":[
                  {"platform":"amd64","flavor":"main","image_version":"latest"}
                ]}'
                # {"platform":"amd64","flavor":"nvidia-open","image_version":"latest"}
                ;;
              "all")
                matrix='{"include":[
                  {"platform":"amd64","flavor":"main","image_version":"latest"}
                ]}'
                # {"platform":"amd64","flavor":"nvidia-open","image_version":"latest"}
                ;;
            esac
          else
            # Default for non-workflow_dispatch (like pull_request / push)
            matrix='{"include":[
              {"platform":"amd64","flavor":"main","image_version":"latest"}
            ]}'
            # {"platform":"amd64","flavor":"nvidia-open","image_version":"latest"}
          fi

          # Compact the JSON and output it
          compact_matrix=$(echo "$matrix" | jq -c .)
          echo "matrix=$compact_matrix" >>$GITHUB_OUTPUT
          echo "Generated matrix:"
          echo "$matrix" | jq .

  build:
    name: Build ISOs
    runs-on: ${{ matrix.platform == 'amd64' && 'ubuntu-24.04' || 'ubuntu-24.04-arm' }}
    needs: determine-matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.determine-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: read
      id-token: write

    steps:
      - name: Install dependencies
        if: matrix.platform == 'arm64'
        run: |
          set -euxo pipefail
          sudo apt update -y
          sudo apt install -y podman

      - name: Maximize build space (remove-software)
        if: matrix. platform != 'arm64'
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6 # v10

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        # with:
        #   submodules: recursive

      - name: Setup Just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # - name: Check Just Syntax
      #   shell: bash
      #   run: |
      #     set -euxo pipefail
      #     just check

      - name: Format image ref
        id: image_ref
        env:
          FLAVOR: ${{ matrix.flavor }}
        run: |
          set -euxo pipefail
          # Standard variants use the Just recipe to determine image name
          image_name=$(just image_name "silver-ublue" \
                "${{ matrix.image_version }}" "${{ matrix.flavor }}")
          image_ref="${IMAGE_REGISTRY}/${image_name}"
          effective_tag="${{ inputs.image_tag || matrix.image_version }}"
          artifact_format="$image_name-${effective_tag}-$(uname -m)"
          KARGS="NONE"
          {
            echo "image_ref=$image_ref"
            echo "artifact_format=$artifact_format"
            echo "kargs=$KARGS"
          } >>"${GITHUB_OUTPUT}"

      - name: Generate titanoboa-compatible file list
        id: flatpak_list
        run: |
          set -euxo pipefail
          FILE_LIST="$(mktemp)"
          sed 's/ *#.*//; /^$/d' \
                "${{ github.workspace }}/build_files/iso/system-flatpaks.list" \
                >"${FILE_LIST}"
          echo "file_list_path=${FILE_LIST}" | tee "${GITHUB_OUTPUT}"

      - name: Build ISO
        id: build
        env:
          IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}:${{ inputs.image_tag || matrix.image_version }}
          FLATPAKS_LIST: ${{ steps.flatpak_list.outputs.file_list_path }}
          HOOK_POST_ROOTFS: ${{ format('{0}/iso_files/configure_iso_anaconda.sh', github.workspace) }}
          BUILDER_DISTRO: ${{ 'fedora' }}
        # uses: ublue-os/titanoboa@main
        # with:
        #   # image-ref: ${{ steps.image_ref.outputs.image_ref }}:${{ matrix.image_version }}
        #   image-ref: ghcr.io/dperson/silver-ublue:${{ matrix.image_version }}
        #   flatpaks-list: ${{ steps.flatpak_list.outputs.file_list_path }}
        #   hook-post-rootfs: ${{ format('{0}/iso_files/configure_iso_anaconda.sh', github.workspace) }}
        #   kargs: ${{ steps.image_ref.outputs.kargs }}
        #   builder-distro: ${{ 'fedora' }}
        run: |
          set -euo pipefail
          titanoboa_dir="${RUNNER_TEMP}/titanoboa"
          git clone --quiet https://github.com/ublue-os/titanoboa \
                "${titanoboa_dir}"
          git -C "${titanoboa_dir}" checkout --quiet \
                840217d97bd0bc9a52466508c54d8dda5c5ba2fd

          # just 1.57 requires the list language feature used by which().
          sed -i '1a set lists' "${titanoboa_dir}/Justfile"
          just_bin="$(command -v just)"
          sudo env PATH="${PATH}" CI="${CI}" \
                HOOK_post_rootfs="${HOOK_POST_ROOTFS}" \
                TITANOBOA_BUILDER_DISTRO="${BUILDER_DISTRO}" \
                "${just_bin}" -f "${titanoboa_dir}/Justfile" build \
                "${IMAGE_REF}" 1 "${FLATPAKS_LIST}" squashfs NONE "${IMAGE_REF}" 1
          sudo chown "$(id -u):$(id -g)" "${titanoboa_dir}/output.iso"
          mv "${titanoboa_dir}/output.iso" output.iso

      - name: Rename ISO
        id: rename
        env:
          OUTPUT_PATH: ${{ steps.build.outputs.iso-dest }}
          FLAVOR: ${{ matrix.flavor }}
          OUTPUT_NAME: ${{ steps.image_ref.outputs.artifact_format }}
          IMAGE_VERSION: ${{ matrix.image_version }}
          IMAGE_REF: ${{ steps.image_ref.outputs.image_ref }}
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euxo pipefail
          mkdir -p output
          OUTPUT_DIRECTORY="$(realpath output)"
          mv "${OUTPUT_PATH}" "${OUTPUT_DIRECTORY}/${OUTPUT_NAME}.iso"
          (cd "${OUTPUT_DIRECTORY}" && sha256sum "${OUTPUT_NAME}.iso" |
                tee "${OUTPUT_NAME}.iso-CHECKSUM")
          iso_sha256="$(awk '{print $1}' \
                "${OUTPUT_DIRECTORY}/${OUTPUT_NAME}.iso-CHECKSUM")"
          cat >"${OUTPUT_DIRECTORY}/${OUTPUT_NAME}.manifest.json" <<EOF
          {
            "candidate_id": "${GITHUB_RUN_ID}-${OUTPUT_NAME}",
            "source_repo": "${GITHUB_REPOSITORY}",
            "source_sha": "${GITHUB_SHA}",
            "source_run_id": "${GITHUB_RUN_ID}",
            "variant": "${IMAGE_VERSION}",
            "flavor": "${FLAVOR}",
            "platform": "${PLATFORM:-$(uname -m)}",
            "image_ref": "${IMAGE_REF:-${IMAGE_REGISTRY}/${IMAGE_NAME}}",
            "image_tag": "${{ inputs.image_tag || matrix.image_version }}",
            "iso_filename": "${OUTPUT_NAME}.iso",
            "iso_sha256": "${iso_sha256}"
          }
          EOF
          echo "output_directory=$OUTPUT_DIRECTORY" >>"${GITHUB_OUTPUT}"

      - name: Upload ISO Artifact
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: iso-${{ github.run_id }}-${{ matrix.image_version }}-${{ matrix.flavor }}-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ steps.rename.outputs.output_directory }}/${{ steps.image_ref.outputs.artifact_format }}.iso
            ${{ steps.rename.outputs.output_directory }}/${{ steps.image_ref.outputs.artifact_format }}.manifest.json

      - name: Upload Run CHECKSUM Artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: checksum-${{ github.run_id }}-${{ matrix.image_version }}-${{ matrix.flavor }}-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            ${{ steps.rename.outputs.output_directory }}/${{ steps.image_ref.outputs.artifact_format }}.iso-CHECKSUM

      - name: Upload to Job Artifacts
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7
        with:
          name: ${{ steps.image_ref.outputs.artifact_format }}
          if-no-files-found: error
          path: ${{ steps.rename.outputs.output_directory }}

      - name: Upload ISOs and Checksum to R2 Bucket
        if: github.ref_name == 'main'
        shell: bash
        env:
          RCLONE_CONFIG_S3_TYPE: s3
          RCLONE_CONFIG_S3_PROVIDER: ${{ secrets.S3_PROVIDER }}
          RCLONE_CONFIG_S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          RCLONE_CONFIG_S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_S3_REGION: ${{ secrets.S3_REGION }}
          RCLONE_CONFIG_S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          SOURCE_DIR: ${{ steps.rename.outputs.output_directory }}
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone copy --log-level INFO --checksum "${SOURCE_DIR}" \
                S3:${{ secrets.S3_BUCKET_NAME }}